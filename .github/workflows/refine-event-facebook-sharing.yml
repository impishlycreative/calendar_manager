name: Refine event Facebook sharing lifecycle

on:
  push:
    branches:
      - feature/event-facebook-sharing
    paths:
      - ".github/workflows/refine-event-facebook-sharing.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-facebook-sharing

      - name: Refine draft lifecycle handling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('google_app_scripts/WebApp.gs')
          text = p.read_text()
          old = '''  const share =\n    trySyncEventShareArtifact_(created);'''
          new = '''  const share = created.status === "Published"\n    ? trySyncEventShareArtifact_(created)\n    : { ok: true, state: "not-required" };'''
          if old not in text: raise SystemExit('create share pattern not found')
          text = text.replace(old, new, 1)
          old = '''  const share =\n    trySyncEventShareArtifact_(updated);'''
          new = '''  const share = updated.status === "Published"\n    ? trySyncEventShareArtifact_(updated)\n    : existing.status === "Published"\n      ? tryRetireEventShareArtifact_(updated, "This event is not currently published.")\n      : { ok: true, state: "not-required" };'''
          if old not in text: raise SystemExit('update share pattern not found')
          text = text.replace(old, new, 1)
          p.write_text(text)

          doc = Path('kcw-calendar-site/FACEBOOK-SHARING.md')
          value = doc.read_text()
          value = value.replace(
            '- Publishing creates or updates the stable event-ID share file.\n',
            '- Publishing creates or updates the stable event-ID share file.\n- A never-published Draft does not contact GitHub or require a share artifact.\n'
          )
          doc.write_text(value)
          PY

      - name: Validate
        run: |
          node --test tests/*.test.cjs
          git diff --check

      - name: Commit refinement
        run: |
          git config user.name "KCW Implementation Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add google_app_scripts/WebApp.gs kcw-calendar-site/FACEBOOK-SHARING.md
          git commit -m "Avoid share publishing for never-published drafts"
          git push origin HEAD:feature/event-facebook-sharing
