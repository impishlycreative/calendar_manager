name: Sync KCW images to mainsite dev

on:
  push:
    branches:
      - main
    paths:
      - "kcw-calendar-site/images/**"

  workflow_dispatch:

concurrency:
  group: sync-kcw-mainsite-dev
  cancel-in-progress: false

jobs:
  sync-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout calendar-manager
        uses: actions/checkout@v4

      - name: Verify TARGET_TOKEN access
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TARGET_TOKEN:-}" ]; then
            echo "::error::TARGET_TOKEN is empty or unavailable to this workflow."
            exit 1
          fi

          api_get() {
            local url="$1"
            local output="$2"
            curl --silent --show-error \
              --output "$output" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${TARGET_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$url"
          }

          user_status="$(api_get "https://api.github.com/user" /tmp/target-user.json)"
          if [ "$user_status" != "200" ]; then
            echo "::error::TARGET_TOKEN could not authenticate to GitHub (GET /user returned HTTP ${user_status})."
            exit 1
          fi

          repo_status="$(api_get "https://api.github.com/repos/kemptvillecw/mainsite" /tmp/target-repo.json)"
          if [ "$repo_status" != "200" ]; then
            echo "::error::TARGET_TOKEN cannot access kemptvillecw/mainsite (HTTP ${repo_status})."
            exit 1
          fi

          login="$(jq -r '.login // "unknown"' /tmp/target-user.json)"
          can_read="$(jq -r '.permissions.pull // false' /tmp/target-repo.json)"
          can_push="$(jq -r '.permissions.push // false' /tmp/target-repo.json)"
          is_admin="$(jq -r '.permissions.admin // false' /tmp/target-repo.json)"

          echo "Authenticated as: ${login}"
          echo "mainsite read access: ${can_read}"
          echo "mainsite push access: ${can_push}"
          echo "mainsite admin access: ${is_admin}"

          if [ "$can_read" != "true" ] || [ "$can_push" != "true" ]; then
            echo "::error::TARGET_TOKEN does not have the required read/write access to kemptvillecw/mainsite."
            exit 1
          fi

      - name: Checkout KCW mainsite dev
        uses: actions/checkout@v4
        with:
          repository: kemptvillecw/mainsite
          ref: dev
          token: ${{ secrets.TARGET_TOKEN }}
          path: mainsite

      - name: Copy images to mainsite
        run: |
          mkdir -p mainsite/images
          cp -R kcw-calendar-site/images/. mainsite/images/

      - name: Commit and push changes
        working-directory: mainsite
        run: |
          git config user.name "KCW Calendar Manager"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add images/

          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi

          git commit -m "Sync images from Calendar Manager"
          git pull --rebase origin dev
          git push origin dev
