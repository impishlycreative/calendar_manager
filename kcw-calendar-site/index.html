<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>KCW Calendar Login</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>

  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <div class="brand">
          <div class="brand-mark">KCW</div>
          <div>
            <h1>Calendar Manager</h1>
            <p>Kemptville Creative Writers</p>
          </div>
        </div>

        <div id="configWarning" class="notice warning" hidden>
          Firebase or API configuration is incomplete.
          See <strong>README.md</strong>.
        </div>

        <form id="loginForm">
          <label>
            Email
            <input
              id="email"
              type="email"
              autocomplete="username"
              required
            >
          </label>

          <label>
            Password
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </label>

          <button id="loginButton" class="primary" type="submit">
            Sign in
          </button>

          <p id="loginError" class="error" role="alert"></p>
        </form>

        <p class="help">
          Accounts are created by the KCW administrator.
          There is no public registration.
        </p>
      </section>
    </main>

    <script type="module" src="assets/login.js"></script>
  </body>
</html>
