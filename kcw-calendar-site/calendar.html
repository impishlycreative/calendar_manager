<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>KCW Calendar Manager</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>

  <body>
    <header class="topbar">
      <div>
        <strong>KCW</strong>
        <span>Calendar Manager</span>
      </div>

      <div class="account">
        <span id="userEmail"></span>
        <button id="logoutButton" class="secondary">Sign out</button>
      </div>
    </header>

    <main class="app-shell">
      <section class="toolbar">
        <div>
          <h1>Calendar entries</h1>
          <p>Create, edit, and remove events from the managed calendar.</p>
        </div>

        <button id="addButton" class="primary">+ Add event</button>
      </section>

      <div id="status" class="notice" hidden></div>
      <section id="events" class="event-list" aria-live="polite"></section>
    </main>

    <dialog id="eventDialog">
      <form id="eventForm" method="dialog">
        <div class="dialog-head">
          <h2 id="dialogTitle">Add event</h2>
          <button
            type="button"
            id="closeDialog"
            class="icon-button"
            aria-label="Close"
          >
            ×
          </button>
        </div>

        <p id="editorError" class="notice error-box" role="alert" hidden></p>
        <input type="hidden" id="eventId">

        <label>
          Type
          <select id="type" required>
            <option value="Meeting">Meeting</option>
            <option value="Contest">Contest</option>
            <option value="Other">Other</option>
          </select>
        </label>        <label>
          Title
          <input id="title" maxlength="160" required>
        </label>

        <div class="grid2">
          <label>
            Start
            <input id="start" type="datetime-local" required>
          </label>

          <label>
            End
            <input id="end" type="datetime-local" required>
          </label>
        </div>

        <label>
          Location
          <select id="location" required>
            <option value="" disabled selected>Select a location</option>
            <option value="Tallman room">Tallman room</option>
            <option value="Virtual">Virtual</option>
          </select>
        </label>

        <label class="checkbox-label">
          <input id="featured" type="checkbox">
          Featured? (checked: Yes, unchecked: No)
        </label>

        <label>
          Hover text
          <input id="hoverText" maxlength="500">
        </label>

        <label>
          Description
          <textarea id="description" rows="6" maxlength="5000"></textarea>
        </label>        <div class="dialog-actions">
          <button type="button" id="cancelButton" class="secondary">
            Cancel
          </button>
          <button type="submit" class="primary">Save event</button>
        </div>
      </form>
    </dialog>

    <dialog id="deleteDialog">
      <div class="confirm">
        <h2>Delete event?</h2>
        <p id="deleteMessage">
          This event will be removed from the calendar.
        </p>

        <div class="dialog-actions">
          <button id="cancelDelete" class="secondary">Cancel</button>
          <button id="confirmDelete" class="danger">Delete event</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="assets/calendar.js"></script>
  </body>
</html>
